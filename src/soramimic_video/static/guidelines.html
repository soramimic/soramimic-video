<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>利用ガイドライン | Soramimic</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc; --panel: #fff; --text: #1e293b;
    --muted: #64748b; --border: #e2e8f0; --link: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a; --panel: #1e293b; --text: #e2e8f0;
      --muted: #94a3b8; --border: #334155; --link: #93c5fd;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); line-height: 1.8;
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans",
      "Noto Sans JP", "Noto Sans CJK JP", sans-serif;
  }
  main { max-width: 48rem; margin: 0 auto; padding: 2rem 1rem; }
  a { color: var(--link); text-underline-offset: .2em; overflow-wrap: anywhere; }
  .brand { font-size: 1.2rem; font-weight: 700; text-decoration: none; }
  section {
    margin: 1.5rem 0; padding: clamp(1rem, 4vw, 2rem); background: var(--panel);
    border: 1px solid var(--border); border-radius: 12px;
  }
  h1 { margin: 0 0 .75rem; font-size: 1.5rem; }
  h2 { margin: 0 0 .75rem; font-size: 1.2rem; }
  p { margin: 0; color: var(--muted); }
  .guidelines { margin: 1.5rem 0 0; padding-left: 1.3rem; }
  .guidelines li + li { margin-top: 1rem; }
  .back { font-size: .9rem; }
</style>
</head>
<body>
<main>
  <a class="brand" href="/">Soramimic</a>
  <section aria-labelledby="guidelines-title">
    <h1 id="guidelines-title">利用ガイドライン</h1>
    <p>動画に含まれる画像・キャラクターなどの利用条件をご確認ください。</p>
    <!-- guideline-links -->
  </section>
  <section aria-labelledby="contact-title">
    <h2 id="contact-title">権利者の方へ</h2>
    <p>動画内の画像に関するご連絡・ご要望は、
      <!-- contact-x-link -->
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSfULm5HwhHmI8egbgB8Afoy30BWBSwY8rPKtQIhgvvP27_kgg/viewform" target="_blank" rel="noopener noreferrer">お問い合わせフォーム</a>からお寄せください。</p>
  </section>
  <a class="back" href="/">動画メーカーに戻る</a>
</main>
</body>
</html>
