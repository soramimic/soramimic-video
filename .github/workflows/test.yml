# デプロイ時と同じpin済みsubmoduleを再帰取得し、editor設定・単語リスト・Video側設定の
# 組み合わせをCIで検証する。branchの系譜ではなく、実際に配る構成を正とする。
name: test
on:
  push:
    branches: [dev, preview, main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: テストするref
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: astral-sh/setup-uv@v5
      - name: Set up FFmpeg and FFprobe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ffmpeg_setup_dir="${RUNNER_TEMP}/ffmpeg-ci"
          ffmpeg_archive=ffmpeg-n8.1.3-27-g8dca1586f4-linux64-gpl-8.1.tar.xz
          mkdir -p "$ffmpeg_setup_dir"
          gh release download autobuild-2026-10-31-12-59 --repo FFmpeg-Builds/FFmpeg-Builds \
            --pattern "$ffmpeg_archive" --dir "$ffmpeg_setup_dir"
          cd "$ffmpeg_setup_dir"
          printf '41e9c565594c390622cf968d82fa4135d9e9a11d06c1515644288cbc844e3380  %s\n' "$ffmpeg_archive" | sha256sum --check --strict
          mkdir extracted
          tar -xJf "$ffmpeg_archive" --strip-components=1 -C extracted
          printf '%s\n' "$ffmpeg_setup_dir/extracted/bin" >> "$GITHUB_PATH"
          "$ffmpeg_setup_dir/extracted/bin/ffmpeg" -version
          "$ffmpeg_setup_dir/extracted/bin/ffprobe" -version
      - run: uv sync --extra api
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest -q
      - name: Markdown-only PR policy tests
        run: node tests/main-pr-policy.cjs
