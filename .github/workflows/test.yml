# デプロイ時と同じpin済みsubmoduleを再帰取得し、editor設定・単語リスト・Video側設定の
# 組み合わせをCIで検証する。branchの系譜ではなく、実際に配る構成を正とする。
name: test
on:
  push:
    branches: [dev, preview, main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: テストするref
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --extra api
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest -q
