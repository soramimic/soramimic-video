# submoduleはcheckoutしない(soramimic本体はprivateのためGITHUB_TOKENで取れない)。
# 替え歌変換は soramimic ライブラリ(uv syncで導入)でPython完結するため、
# convert/editor 連携のテストもCIで実行される(editor_io の conf/setting.json 参照は
# submodule未取得でもフォールバックする)。
name: test
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_call:
    inputs:
      ref:
        description: テストするref
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: astral-sh/setup-uv@v5
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --extra api
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest -q
