# preview の公開候補を固定した SHA で検証し、手動release PRの案内を出す。
# main への反映は、release PR の現在の head SHA の CI を確認して人間が行う。
name: release
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 23 * * 0" # 毎週月曜 08:00 JST 頃
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('release-pr-{0}', github.event.pull_request.number) || 'release-prepare' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resolve:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.resolve.outputs.changed }}
      preview_sha: ${{ steps.resolve.outputs.preview_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: 検証する preview SHA を固定
        id: resolve
        run: |
          preview_sha=$(git ls-remote origin refs/heads/preview | awk '{print $1}')
          if [ -z "$preview_sha" ]; then
            echo "preview ブランチが存在しないためスキップします"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags origin "$preview_sha"
          count=$(git rev-list --count "origin/main..$preview_sha")
          echo "preview ($preview_sha) には main にないコミットが ${count} 件"
          echo "preview_sha=$preview_sha" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  test-candidate:
    needs: resolve
    if: ${{ needs.resolve.outputs.changed == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      # ブランチ名ではなく、resolve で取得した不変の commit SHA を検証する。
      ref: ${{ needs.resolve.outputs.preview_sha }}

  publish-instructions:
    needs: [resolve, test-candidate]
    if: ${{ needs.resolve.outputs.changed == 'true' && needs.test-candidate.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PREVIEW_SHA: ${{ needs.resolve.outputs.preview_sha }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: 手動release PRの案内を表示
        run: |
          current_sha=$(gh api "repos/$REPO/git/ref/heads/preview" --jq '.object.sha')
          {
            echo "## Release candidate の検証完了"
            echo
            echo "- 検証済み preview SHA: \`$PREVIEW_SHA\`"
            echo "- 現在の preview SHA: \`$current_sha\`"
            echo
            if [ "$current_sha" = "$PREVIEW_SHA" ]; then
              echo "[preview → main のPRを作成または確認する](https://github.com/$REPO/compare/main...preview?expand=1)"
              echo
              echo "PRのタイトルは \`release: preview → main\` とし、公開内容を本文に記載してください。"
              echo "PR作成後は、PRの現在のhead SHAに対する必須チェックを確認して手動マージしてください。"
            else
              echo "> preview が検証中に進みました。この結果は \`$PREVIEW_SHA\` だけに対するものです。"
              echo "> Actionsからreleaseを再実行し、現在のpreview SHAを検証してからPRを作成してください。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$current_sha" = "$PREVIEW_SHA" ]; then
            echo "検証済みSHAの手動PR作成リンクをjob summaryへ出力しました"
          else
            echo "previewが進んだため再実行が必要です"
          fi

  test-release-pr-head:
    # main の必須チェックとして安定した名前で使えるよう、release と emergency の
    # どちらの同一repository PRでもheadそのものを検証する。
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      # 通常の test workflow が検証する merge ref に加え、承認・マージ対象の
      # head SHA 自体も検証する。
      ref: ${{ github.event.pull_request.head.sha }}

  reject-fork-main-pr:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: forkからmainへのPRを拒否
        run: |
          echo "forkのhead SHAはこのrelease gateでは検証しません。PRのbaseをdevに変更してください。" >&2
          exit 1
