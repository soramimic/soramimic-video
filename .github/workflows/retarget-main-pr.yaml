# main宛ては同一repositoryのpreviewブランチからのPull Requestだけを許可する。
# それ以外はdevへ向け直し、通常の開発・検証フローへ戻す。
# - PRのコードは checkout しないため、pull_request_target でも安全
name: retarget-main-pr
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: retarget-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  retarget:
    if: ${{ github.event.pull_request.head.ref != 'preview' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: base を dev に付け替えて通知
        run: |
          gh pr edit "$PR" --repo "$REPO" --base dev
          gh pr comment "$PR" --repo "$REPO" --body "🔀 baseを\`main\`から\`dev\`へ変更しました。\`main\`へマージできるのは、同一repositoryの\`preview\`ブランチからのrelease PRだけです。"
